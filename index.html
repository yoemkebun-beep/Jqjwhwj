function tabs(){const Z=S.items.filter(x=>ex(x)<=0).length,L=S.items.filter(x=>ex(x)>0&&ex(x)<=3).length;

 $("tabs").innerHTML=T.map(t=>`<button data-t="${t[0]}" aria-pressed="${tab==t[0]}">${t[1]}</button>`).join("");
 $("sum").textContent=Z+" agotados de "+S.items.length+" productos · inversión "+N(S.items.reduce((s,x)=>s+Math.max(inv(x),0),0))}
const alertsHTML=()=>S.alerts.length?'<div class="al"><b>⚠ Se agotó:</b> '+S.alerts.map(a=>esc(a.n)).join(", ")+'<button id="okal">Entendido</button></div>':'';
function render(){
 const q=$("q").value.toLowerCase().trim(),ss=sel();
 const a=S.items.map((x,i)=>[x,i+1]).filter(([x])=>(tab=="d"?ex(x)>0:tab=="z"?ex(x)<=0:tab=="l"?ex(x)>0&&ex(x)<=3:tab=="m"?ss.has(x.id):true)&&(!q||x.n.toLowerCase().includes(q)));
 $("list").innerHTML=alertsHTML()+(tab=="z"?'<div class="zb"><button class="p" id="zl">Ver y copiar lista de agotados</button></div>':tab=="l"?'<div class="zb"><button class="p" id="pl">Ver y copiar lista de pocos</button></div>':'')+(a.length?a.map(([x,i])=>{const e=ex(x);return `<div class="it${ss.has(x.id)?" sel":""}"><div class="top"><input type="checkbox" data-i="${x.id}"${ss.has(x.id)?" checked":""} aria-label="Marcar para reponer"><div class="nm"><b>${i}. ${esc(x.n)}</b><small>${esc(x.u)||"—"}</small></div><div class="st ${cls(e)}">${e}<small>${e<=0?"agotado":"existencia"}</small></div></div>
<div class="g"><div><span>Entrada</span>${x.en}</div><div><span>Salida</span>${x.sa}</div><div><span>Existencia</span>${e}</div><div><span>Compra</span>${N(x.co)}</div><div><span>$ Inversión</span>${N(inv(x))}</div><div><span>USD Tienda</span>${N(x.usd)}</div><div><span>Precio Página</span>${N(pp(x))}</div></div>
<div class="act"><button class="vd" data-v="${x.id}">Vender</button><button data-e="${x.id}">Editar</button><button class="del" data-d="${x.id}">Eliminar</button></div></div>`}).join(""):'<p class="empty">No hay productos aquí.</p>');
 const m=S.items.filter(x=>ss.has(x.id));
 $("cnt").textContent=m.length?m.length+" marcados · ref. "+N(m.reduce((s,x)=>s+x.co,0))+" CUP":"Nada marcado";
 tabs()}
function form(x){
 const n=!x;x=x||{n:"",u:"",en:0,sa:0,co:0,usd:250};
 $("sh").innerHTML=`<h2>${n?"Agregar producto":"Editar producto"}</h2>
<label>Nombre del producto<input id="f_n" value="${esc(x.n)}"></label>
<div class="r2"><label>U/M<input id="f_u" value="${esc(x.u)}"></label><label>Compra<input id="f_co" type="number" inputmode="decimal" value="${x.co}"></label>
<label>Entrada<input id="f_en" type="number" inputmode="decimal" value="${x.en}"></label><label>Salida<input id="f_sa" type="number" inputmode="decimal" value="${x.sa}"></label>
<label>USD Tienda<input id="f_usd" type="number" inputmode="decimal" value="${x.usd}"></label></div>
<div class="calc" id="calc"></div>
<div class="btns"><button class="s" id="f_x">Cancelar</button><button class="p" id="f_ok">Guardar</button></div>`;
 const v=id=>parseFloat($(id).value)||0;
 const cu=()=>{const t={en:v("f_en"),sa:v("f_sa"),co:v("f_co"),usd:v("f_usd")};$("calc").textContent="Existencia "+(t.en-t.sa)+" · Inversión "+N((t.en-t.sa)*t.co)+" · Precio Página "+N(pp(t))};
 ["f_en","f_sa","f_co","f_usd"].forEach(i=>$(i).oninput=cu);cu();
 $("f_x").onclick=()=>$("ov").classList.remove("on");
 $("f_ok").onclick=()=>{const nm=$("f_n").value.trim();if(!nm){toast("Escribe el nombre");return}
  const d={n:nm,u:$("f_u").value.trim(),en:v("f_en"),sa:v("f_sa"),co:v("f_co"),usd:v("f_usd")};
  if(n){S.items.push({id:S.next++,...d});tab="a";$("q").value=""}else{const b4=ex(x);Object.assign(x,d);S.alerts=S.alerts.filter(a=>a.id!=x.id);if(b4>0&&ex(x)<=0){S.alerts.push({id:x.id,n:x.n});if(!S.sel.includes(x.id))S.sel.push(x.id);toast("⚠ Se agotó: "+x.n)}}sortA();
  save();$("ov").classList.remove("on");render();if(n||!S.alerts.some(a=>a.id==x.id))toast(n?"Producto agregado":"Cambios guardados")};
 $("ov").classList.add("on")}
function zlist(){
 const z=S.items.filter(x=>ex(x)<=0),t="Agotados – FarmaSur Las Tunas\n"+z.map(x=>"- "+x.n+(x.u?" ("+x.u+")":"")).join("\n");
 $("sh").innerHTML=`<h2>Agotados (${z.length})</h2><pre id="zt" style="white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);padding:10px;border-radius:10px;max-height:50vh;overflow:auto;margin:0">${esc(t)}</pre><div class="btns"><button class="s" id="z_x">Cerrar</button><button class="p" id="z_cp">Copiar lista</button></div>`;
 $("z_x").onclick=()=>$("ov").classList.remove("on");
 $("z_cp").onclick=async()=>{try{await navigator.clipboard.writeText(t);toast("Lista copiada ("+z.length+")")}catch(e){const r=document.createRange();r.selectNodeContents($("zt"));const g=getSelection();g.removeAllRanges();g.addRange(r);toast("Selecciona y copia")}};
 $("ov").classList.add("on")}
function plist(){
 const z=S.items.filter(x=>ex(x)>0&&ex(x)<=3),t="Pocos – FarmaSur Las Tunas\n"+z.map(x=>"- "+x.n).join("\n");
 $("sh").innerHTML=`<h2>Pocos (${z.length})</h2><pre id="zt" style="white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);padding:10px;border-radius:10px;max-height:50vh;overflow:auto;margin:0">${esc(t)}</pre><div class="btns"><button class="s" id="z_x">Cerrar</button><button class="p" id="z_cp">Copiar lista</button></div>`;
 $("z_x").onclick=()=>$("ov").classList.remove("on");
 $("z_cp").onclick=async()=>{try{await navigator.clipboard.writeText(t);toast("Lista copiada ("+z.length+")")}catch(e){const r=document.createRange();r.selectNodeContents($("zt"));const g=getSelection();g.removeAllRanges();g.addRange(r);toast("Selecciona y copia")}};
 $("ov").classList.add("on")}
async function dl(name,blob){
 try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){toast("No se pudo descargar");return false}}
function bkSheet(){
 const lb=S.lastBk?new Date(S.lastBk).toLocaleDateString("es"):"nunca";
 $("sh").innerHTML=`<h2>Respaldo</h2><p class="sub">Último respaldo guardado: ${lb}</p><p style="font-size:14px">Guarda el archivo en un lugar seguro (WhatsApp, Telegram, correo o la nube). Si pierdes el teléfono, lo restauras aquí.</p><div class="btns"><button class="p" id="b_sv">Guardar respaldo</button></div><label>Restaurar desde un archivo<input id="b_f" type="file" accept=".json,application/json"></label><div class="btns"><button class="s" id="b_x">Cerrar</button></div>`;
 $("b_x").onclick=()=>$("ov").classList.remove("on");
 $("b_sv").onclick=async()=>{const dt=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify({app:"farmasur",v:2,fecha:new Date().toISOString(),items:S.items,next:S.next,sel:S.sel,alerts:S.alerts,orders:S.orders})],{type:"application/json"});
  if(await dl("farmasur-respaldo-"+dt+".json",blob)){S.lastBk=Date.now();save();$("ov").classList.remove("on");toast("Respaldo guardado")}};
 $("b_f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let j;try{j=JSON.parse(r.result);if(!j||!Array.isArray(j.items)||!j.items.every(x=>x&&typeof x.n=="string"&&typeof x.en=="number"&&typeof x.sa=="number"&&typeof x.co=="number"))throw 0}catch(_){toast("Archivo no válido");return}
   $("sh").innerHTML=`<h2>Restaurar respaldo</h2><p>El archivo tiene ${j.items.length} productos. Esto reemplaza los datos actuales de este teléfono.</p><div class="btns"><button class="s" id="r_x">Cancelar</button><button class="p" id="r_ok">Restaurar</button></div>`;
   $("r_x").onclick=()=>$("ov").classList.remove("on");
   $("r_ok").onclick=()=>{const it=j.items.map((x,i)=>({id:typeof x.id=="number"?x.id:i,n:String(x.n),u:String(x.u||""),en:x.en,sa:x.sa,co:x.co,usd:+x.usd||250}));
    S={items:it,next:Math.max(-1,...it.map(x=>x.id))+1,sel:Array.isArray(j.sel)?j.sel:[],alerts:Array.isArray(j.alerts)?j.alerts:[],orders:Array.isArray(j.orders)?j.orders:[],lastBk:S.lastBk};
    sortA();save();tab="d";$("ov").classList.remove("on");render();toast("Respaldo restaurado")}};
  r.readAsText(f)};
 $("ov").classList.add("on")}
$("bk").onclick=bkSheet;
const shut=()=>$("ov").classList.remove("on");
const SW=new Set(["de","del","en","la","el","con","para","y","al","un","una"]);
const tok=s=>[...new Set(s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/(\d)([a-z])/g,"$1 $2").replace(/([a-z])(\d)/g,"$1 $2").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(w=>w&&!SW.has(w)))];
const rank=l=>{const a=tok(l);return S.items.map(x=>{const b=tok(x.n+" "+x.u),i=b.filter(w=>a.includes(w)).length;return [x,b.length&&a.length?0.7*i/b.length+0.3*i/a.length+(ex(x)>0?0.01:0):0]}).sort((p,q)=>q[1]-p[1])};
function parseInv(t){const g=r=>{const m=t.match(r);return m?m[1].trim():""};const L=[];
 t.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*[*\u2022]\s*(\d+)\s*[xX]?\s+(.+?)\s*$/);if(m)L.push({q:+m[1],t:m[2]})});
 return {ped:g(/Pedido\s*#?\s*:?\s*([0-9A-Za-z-]+)/i),cli:g(/Entregar a\s*:\s*(.+)/i),L}}
let INV=null;
function facSheet(){
 $("sh").innerHTML=`<h2>Factura</h2><p class="sub">Pega aquí el texto de la factura. Los productos son las líneas que empiezan con *.</p><textarea id="fa_t" placeholder="Pedido #: 123&#10;*1 Antigripal Jarabe 120 ml&#10;*2 Vitamina complejo B 120 ml"></textarea><div class="btns"><button class="s" id="fa_x">Cancelar</button><button class="p" id="fa_ok">Leer factura</button></div>`;
 $("fa_x").onclick=shut;
 $("fa_ok").onclick=()=>{const p=parseInv($("fa_t").value);if(!p.L.length){toast("No encontré productos (deben empezar con *)");return}
  INV={ped:p.ped,cli:p.cli,rows:p.L.map(l=>{const r=rank(l.t);return {q:l.q,t:l.t,top:r.slice(0,3).map(z=>z[0].id),id:r[0][1]>=0.45?r[0][0].id:null}})};invView();if(INV.rows.some(r=>r.id===null))toast("⚠ Error: hay productos que no están en el inventario. No se descontará nada")};
 $("ov").classList.add("on")}
const opt=x=>`${esc(x.n)}${x.u?" "+esc(x.u):""} · ${ex(x)} disp.`;
function stt(i){const r=INV.rows[i],e=$("fs"+i);if(!e)return;
 if(r.id===null){e.className="fs wr";e.textContent="Elige el producto";return}
 const x=S.items.find(y=>y.id==r.id),av=ex(x);
 if(av<=0){e.className="fs bad";e.textContent="Agotado: no se puede descontar"}
 else if(r.q>av){e.className="fs bad";e.textContent="Solo hay "+av+": se descontarán "+av}
 else{e.className="fs ok";e.textContent="Quedarán "+(av-r.q)}}
function updMis(){const m=INV.rows.filter(r=>r.id===null).map(r=>r.t),e=$("mis");if(!e)return;
 e.style.display=m.length?"block":"none";e.innerHTML=m.length?"<b>⚠ Error: no están en el inventario:</b> "+m.map(esc).join("; ")+". No se descontará nada hasta que todos coincidan. Elige el producto en la lista; si no existe, agrégalo al inventario y vuelve a leer la factura.":"";
 const b=$("iv_ok");if(b){b.disabled=m.length>0;b.style.opacity=m.length?".4":"1"}}
function invView(){
 const dup=INV.ped&&S.orders.includes(INV.ped);
 $("sh").innerHTML=`<h2>Revisar factura</h2><p class="sub">${INV.ped?"Pedido #"+esc(INV.ped):"Sin número de pedido"}${INV.cli?" · "+esc(INV.cli):""}</p>${dup?'<div class="al">Este pedido ya se descontó antes. Revisa que no sea repetido.</div>':''}<div class="al" id="mis"></div>`+INV.rows.map((r,i)=>{
  const top=r.top.map(id=>S.items.find(x=>x.id==id)).filter(Boolean),o=x=>`<option value="${x.id}"${r.id!==null&&r.id==x.id?" selected":""}>${opt(x)}</option>`;
  return `<div class="fr"><b>${esc(r.t)}</b><div class="fq"><span class="sub">Cantidad</span><input type="number" inputmode="numeric" min="0" value="${r.q}" data-q="${i}"></div><select data-s="${i}"><option value="">— elegir producto —</option><optgroup label="Sugerencias">${top.map(o).join("")}</optgroup><optgroup label="Todos">${S.items.map(o).join("")}</optgroup></select><div class="fs" id="fs${i}"></div></div>`}).join("")+`<div class="btns"><button class="s" id="iv_x">Cancelar</button><button class="p" id="iv_ok">${dup?"Descontar de todos modos":"Descontar del inventario"}</button></div>`;
 INV.rows.forEach((r,i)=>stt(i));updMis();
 $("sh").oninput=$("sh").onchange=e=>{const t=e.target;
  if(t.dataset.s!=null){INV.rows[+t.dataset.s].id=t.value===""?null:+t.value;stt(+t.dataset.s);updMis()}
  if(t.dataset.q!=null){INV.rows[+t.dataset.q].q=Math.max(0,parseFloat(t.value)||0);stt(+t.dataset.q)}};
 $("iv_x").onclick=shut;
 $("iv_ok").onclick=()=>{if(INV.rows.some(r=>r.id===null)){toast("Error: hay productos sin coincidir. No se descontó nada");return}
  const done=[],skip=[];
  INV.rows.forEach(r=>{const x=r.id===null?null:S.items.find(y=>y.id==r.id);if(!x||r.q<=0){skip.push(r.t);return}
   const av=ex(x),take=Math.max(0,Math.min(r.q,av));if(take<=0){skip.push(r.t+" (agotado)");return}
   x.sa+=take;done.push({id:x.id,n:x.n,u:x.u,q:take,w:r.q,left:ex(x)});
   if(av>0&&ex(x)<=0){S.alerts=S.alerts.filter(a=>a.id!=x.id);S.alerts.push({id:x.id,n:x.n});if(!S.sel.includes(x.id))S.sel.push(x.id)}});
  if(INV.ped&&!S.orders.includes(INV.ped)){S.orders.push(INV.ped);S.orders=S.orders.slice(-500)}
  S.last={ped:INV.ped,list:done.map(d=>({id:d.id,q:d.q}))};
  sortA();save();render();resView(done,skip)};
 $("ov").classList.add("on")}
function resView(done,skip){
 $("sh").innerHTML=`<h2>Factura descontada</h2>`+(done.length?done.map(d=>`<p style="margin:6px 0">✓ ${d.q} × ${esc(d.n)}${d.u?" "+esc(d.u):""} → quedan ${d.left}${d.q<d.w?' <span class="bad">(faltaron '+(d.w-d.q)+')</span>':''}${d.left<=0?' <b class="bad">· se agotó</b>':''}</p>`).join(""):'<p>No se descontó nada.</p>')+(skip.length?`<div class="al"><b>No se descontó:</b> ${skip.map(esc).join("; ")}</div>`:"")+`<div class="btns"><button class="s" id="rs_u">Deshacer</button><button class="p" id="rs_x">Listo</button></div>`;
 $("rs_x").onclick=shut;
 $("rs_u").onclick=()=>{const L=S.last;if(L){L.list.forEach(z=>{const p=S.items.find(y=>y.id==z.id);if(p)p.sa=Math.max(0,p.sa-z.q)});if(L.ped)S.orders=S.orders.filter(o=>o!=L.ped)}
  S.alerts=S.alerts.filter(a=>{const p=S.items.find(y=>y.id==a.id);return p&&ex(p)<=0});S.last=null;save();shut();render();toast("Factura deshecha")};
 $("ov").classList.add("on")}
$("fa").onclick=facSheet;
function sell(x){
 const e=ex(x);
 $("sh").innerHTML=`<h2>Vender</h2><p style="margin:0">${esc(x.n)}</p><p class="sub">Existencia: ${e}</p><label>Cantidad vendida<input id="s_q" type="number" inputmode="numeric" min="1" value="1"></label><div class="calc" id="calc"></div><div class="btns"><button class="s" id="s_x">Cancelar</button><button class="p" id="s_ok">Registrar venta</button></div>`;
 const q=()=>Math.max(0,parseFloat($("s_q").value)||0);
 const cu=()=>{const r=e-q();$("calc").textContent=r<0?"No alcanza: solo hay "+e:"Quedarán "+r};
 $("s_q").oninput=cu;cu();
 $("s_x").onclick=()=>$("ov").classList.remove("on");
 $("s_ok").onclick=()=>{const n=q();if(n<=0||n>e){toast("Cantidad no válida");return}
  x.sa+=n;
  if(e-n<=0){S.alerts=S.alerts.filter(a=>a.id!=x.id);S.alerts.push({id:x.id,n:x.n});if(!S.sel.includes(x.id))S.sel.push(x.id);toast("⚠ Se agotó: "+x.n)}else toast("Vendido: "+n);
  sortA();save();$("ov").classList.remove("on");render()};
 $("ov").classList.add("on");setTimeout(()=>$("s_q").select(),50)}
$("add").onclick=()=>form();
$("ov").onclick=e=>{if(e.target.id=="ov")$("ov").classList.remove("on")};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
$("q").oninput=render;
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="okal"){S.alerts=[];save();render();return}
 if(b.id=="zl"){zlist();return}
 if(b.id=="pl"){plist();return}
 if(b.dataset.v)sell(S.items.find(x=>x.id==b.dataset.v));
 if(b.dataset.e)form(S.items.find(x=>x.id==b.dataset.e));
 if(b.dataset.d){const x=S.items.find(x=>x.id==b.dataset.d);
  if(b.dataset.c){S.items=S.items.filter(y=>y.id!=x.id);S.sel=S.sel.filter(i=>i!=x.id);S.alerts=S.alerts.filter(a=>a.id!=x.id);save();render();toast("Eliminado");return}
  b.dataset.c=1;b.textContent="Toca otra vez para eliminar";setTimeout(()=>{b.textContent="Eliminar";delete b.dataset.c},3000)}};
$("list").onchange=e=>{const i=+e.target.dataset.i;const s=sel();e.target.checked?s.add(i):s.delete(i);S.sel=[...s];save();render()};
$("cp").onclick=async()=>{const ss=sel(),m=ss.size?S.items.filter(x=>ss.has(x.id)):S.items.filter(x=>ex(x)<=0);
 const t="Reponer – FarmaSur Las Tunas\n"+m.map(x=>"- "+x.n+(x.u?" ("+x.u+")":"")).join("\n");
 try{await navigator.clipboard.writeText(t);toast("Lista copiada ("+m.length+")")}catch(e){toast("No se pudo copiar")}};
$("ex").onclick=async()=>{const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[["No","Nombre del producto","U/M","Entrada","Salida","Existencia","Compra","$ Inversión","USD Tienda","Precio Página"],...S.items.map((x,i)=>[i+1,x.n,x.u,x.en,x.sa,ex(x),x.co,inv(x),x.usd,pp(x)])];
 const csv="\ufeff"+rows.map(r=>r.map(c).join(",")).join("\n");
 if(await dl("inventario-farmasur.csv",new Blob([csv],{type:"text/csv"})))toast("Descargando CSV")};
render();
</script></body></html>

 const q=$("q").value.toLowerCase().trim(),ss=sel();
 const a=S.items.map((x,i)=>[x,i+1]).filter(([x])=>(tab=="d"?ex(x)>0:tab=="z"?ex(x)<=0:tab=="l"?ex(x)>0&&ex(x)<=3:tab=="m"?ss.has(x.id):true)&&(!q||x.n.toLowerCase().includes(q)));
 $("list").innerHTML=alertsHTML()+(a.length?a.map(([x,i])=>{const e=ex(x);return `<div class="it${ss.has(x.id)?" sel":""}"><div class="top"><input type="checkbox" data-i="${x.id}"${ss.has(x.id)?" checked":""} aria-label="Marcar para reponer"><div class="nm"><b>${i}. ${esc(x.n)}</b><small>${esc(x.u)||"—"}</small></div><div class="st ${cls(e)}">${e}<small>${e<=0?"agotado":"existencia"}</small></div></div>
<div class="g"><div><span>Entrada</span>${x.en}</div><div><span>Salida</span>${x.sa}</div><div><span>Existencia</span>${e}</div><div><span>Compra</span>${N(x.co)}</div><div><span>$ Inversión</span>${N(inv(x))}</div><div><span>USD Tienda</span>${N(x.usd)}</div><div><span>Precio Página</span>${N(pp(x))}</div></div>
<div class="act"><button class="vd" data-v="${x.id}">Vender</button><button data-e="${x.id}">Editar</button><button class="del" data-d="${x.id}">Eliminar</button></div></div>`}).join(""):'<p class="empty">No hay productos aquí.</p>');
 const m=S.items.filter(x=>ss.has(x.id));
 $("cnt").textContent=m.length?m.length+" marcados · ref. "+N(m.reduce((s,x)=>s+x.co,0))+" CUP":"Nada marcado";
 tabs()}
function form(x){
 const n=!x;x=x||{n:"",u:"",en:0,sa:0,co:0,usd:250};
 $("sh").innerHTML=`<h2>${n?"Agregar producto":"Editar producto"}</h2>
<label>Nombre del producto<input id="f_n" value="${esc(x.n)}"></label>
<div class="r2"><label>U/M<input id="f_u" value="${esc(x.u)}"></label><label>Compra<input id="f_co" type="number" inputmode="decimal" value="${x.co}"></label>
<label>Entrada<input id="f_en" type="number" inputmode="decimal" value="${x.en}"></label><label>Salida<input id="f_sa" type="number" inputmode="decimal" value="${x.sa}"></label>
<label>USD Tienda<input id="f_usd" type="number" inputmode="decimal" value="${x.usd}"></label></div>
<div class="calc" id="calc"></div>
<div class="btns"><button class="s" id="f_x">Cancelar</button><button class="p" id="f_ok">Guardar</button></div>`;
 const v=id=>parseFloat($(id).value)||0;
 const cu=()=>{const t={en:v("f_en"),sa:v("f_sa"),co:v("f_co"),usd:v("f_usd")};$("calc").textContent="Existencia "+(t.en-t.sa)+" · Inversión "+N((t.en-t.sa)*t.co)+" · Precio Página "+N(pp(t))};
 ["f_en","f_sa","f_co","f_usd"].forEach(i=>$(i).oninput=cu);cu();
 $("f_x").onclick=()=>$("ov").classList.remove("on");
 $("f_ok").onclick=()=>{const nm=$("f_n").value.trim();if(!nm){toast("Escribe el nombre");return}
  const d={n:nm,u:$("f_u").value.trim(),en:v("f_en"),sa:v("f_sa"),co:v("f_co"),usd:v("f_usd")};
  if(n){S.items.push({id:S.next++,...d});tab="a";$("q").value=""}else{const b4=ex(x);Object.assign(x,d);S.alerts=S.alerts.filter(a=>a.id!=x.id);if(b4>0&&ex(x)<=0){S.alerts.push({id:x.id,n:x.n});if(!S.sel.includes(x.id))S.sel.push(x.id);toast("⚠ Se agotó: "+x.n)}}sortA();
  save();$("ov").classList.remove("on");render();if(n||!S.alerts.some(a=>a.id==x.id))toast(n?"Producto agregado":"Cambios guardados")};
 $("ov").classList.add("on")}
function sell(x){
 const e=ex(x);
 $("sh").innerHTML=`<h2>Vender</h2><p style="margin:0">${esc(x.n)}</p><p class="sub">Existencia: ${e}</p><label>Cantidad vendida<input id="s_q" type="number" inputmode="numeric" min="1" value="1"></label><div class="calc" id="calc"></div><div class="btns"><button class="s" id="s_x">Cancelar</button><button class="p" id="s_ok">Registrar venta</button></div>`;
 const q=()=>Math.max(0,parseFloat($("s_q").value)||0);
 const cu=()=>{const r=e-q();$("calc").textContent=r<0?"No alcanza: solo hay "+e:"Quedarán "+r};
 $("s_q").oninput=cu;cu();
 $("s_x").onclick=()=>$("ov").classList.remove("on");
 $("s_ok").onclick=()=>{const n=q();if(n<=0||n>e){toast("Cantidad no válida");return}
  x.sa+=n;
  if(e-n<=0){S.alerts=S.alerts.filter(a=>a.id!=x.id);S.alerts.push({id:x.id,n:x.n});if(!S.sel.includes(x.id))S.sel.push(x.id);toast("⚠ Se agotó: "+x.n)}else toast("Vendido: "+n);
  sortA();save();$("ov").classList.remove("on");render()};
 $("ov").classList.add("on");setTimeout(()=>$("s_q").select(),50)}
$("add").onclick=()=>form();
$("ov").onclick=e=>{if(e.target.id=="ov")$("ov").classList.remove("on")};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
$("q").oninput=render;
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="okal"){S.alerts=[];save();render();return}
 if(b.dataset.v)sell(S.items.find(x=>x.id==b.dataset.v));
 if(b.dataset.e)form(S.items.find(x=>x.id==b.dataset.e));
 if(b.dataset.d){const x=S.items.find(x=>x.id==b.dataset.d);
  if(b.dataset.c){S.items=S.items.filter(y=>y.id!=x.id);S.sel=S.sel.filter(i=>i!=x.id);S.alerts=S.alerts.filter(a=>a.id!=x.id);save();render();toast("Eliminado");return}
  b.dataset.c=1;b.textContent="Toca otra vez para eliminar";setTimeout(()=>{b.textContent="Eliminar";delete b.dataset.c},3000)}};
$("list").onchange=e=>{const i=+e.target.dataset.i;const s=sel();e.target.checked?s.add(i):s.delete(i);S.sel=[...s];save();render()};
$("cp").onclick=async()=>{const ss=sel(),m=ss.size?S.items.filter(x=>ss.has(x.id)):S.items.filter(x=>ex(x)<=0);
 const t="Reponer – FarmaSur Las Tunas\n"+m.map(x=>"- "+x.n+(x.u?" ("+x.u+")":"")).join("\n");
 try{await navigator.clipboard.writeText(t);toast("Lista copiada ("+m.length+")")}catch(e){toast("No se pudo copiar")}};
$("ex").onclick=async()=>{const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[["No","Nombre del producto","U/M","Entrada","Salida","Existencia","Compra","$ Inversión","USD Tienda","Precio Página"],...S.items.map((x,i)=>[i+1,x.n,x.u,x.en,x.sa,ex(x),x.co,inv(x),x.usd,pp(x)])];
 const csv="\ufeff"+rows.map(r=>r.map(c).join(",")).join("\n");
 try{const u=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="inventario-farmasur.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Descargando CSV")}catch(e){toast("No se pudo descargar")}};
render();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
